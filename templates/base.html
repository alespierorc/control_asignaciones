{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel SERMINCO{% endblock %}</title>

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- SWEETALERT2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg-dark: #0e1117;
            --bg-panel: #161b22;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border-soft: #374151;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: "Inter", system-ui, sans-serif;
            margin: 0;
        }

        /* NAVBAR */
        .navbar {
            background-color: var(--bg-panel);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        .navbar-left a {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* BOTONES */
        .chip {
            background: #1e293b;
            padding: 8px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            text-decoration: none;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .chip:hover {
            background: var(--accent-hover);
            color: #fff;
            transform: translateY(-1px);
        }

        /* BOTÓN LOGOUT */
        .chip-logout {
            background: transparent;
            border: 1px solid var(--border-soft);
            color: var(--text-muted);
        }

        .chip-logout:hover {
            background: rgba(239, 68, 68, 0.12);
            border-color: var(--danger);
            color: var(--danger);
        }

        main {
            padding: 25px;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid #1f2937;
            margin-top: 30px;
        }
        .anuncios-chip {
    position: relative;
}

.badge-anuncios {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--danger);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 999px;
    animation: pulse 1.8s infinite;
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6);
    }
    70% {
        box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
    }
}

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="navbar-left">
        <a href="{% url 'asignaciones:home_router' %}">
            <i class="bi bi-buildings"></i> SERMINCO
        </a>
    </div>

    <div class="navbar-right">
        {% if user.is_authenticated %}

            <a class="chip" href="{% url 'asignaciones:home_router' %}">
                <i class="bi bi-house-door"></i> Inicio
            </a>

            {% if mostrar_reportes %}
            <a class="chip" href="{% url 'asignaciones:reportes' %}">
                <i class="bi bi-bar-chart"></i> Reportes
            </a>
            {% endif %}

            <a class="chip anuncios-chip" href="{% url 'asignaciones:anuncios' %}">
    <i class="bi bi-megaphone"></i>
    Anuncios
    <span id="badge-anuncios" class="badge-anuncios" style="display:none;"></span>
</a>

            <a class="chip" href="{% url 'asignaciones:bandeja' %}">
                <i class="bi bi-envelope"></i> Bandeja
            </a>

            <!-- LOGOUT -->
            <a class="chip chip-logout logout-btn"
               href="{% url 'asignaciones:logout' %}"
               title="Cerrar sesión">
                <i class="bi bi-power"></i>
            </a>

        {% else %}
            <a class="chip" href="{% url 'asignaciones:login' %}">
                <i class="bi bi-person-circle"></i> Iniciar sesión
            </a>
        {% endif %}
    </div>
</nav>

<!-- CONTENIDO -->
<main>
    {% block content %}{% endblock %}
</main>

<footer>
    &copy; 2025 SERMINCO — Sistema de Control de Asignaciones
</footer>

<!-- SWEETALERT LOGOUT -->
<script>
document.addEventListener("DOMContentLoaded", () => {

    const logoutBtn = document.querySelector(".logout-btn");

    if (logoutBtn) {
        logoutBtn.addEventListener("click", e => {
            e.preventDefault();

            Swal.fire({
                title: "Cerrar sesión",
                text: "¿Deseas salir del sistema?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Sí, cerrar sesión",
                cancelButtonText: "Cancelar",
                reverseButtons: true,
                confirmButtonColor: "#ef4444",
                cancelButtonColor: "#374151",
                background: "#0e1117",
                color: "#e5e7eb"
            }).then(result => {
                if (result.isConfirmed) {
                    window.location.href = logoutBtn.href;
                }
            });
        });
    }
    const badge = document.getElementById("badge-anuncios");
    if (!badge) return;

    async function actualizarBadge() {
        try {
            const response = await fetch("{% url 'asignaciones:anuncios_no_leidos' %}", {
                headers: { "X-Requested-With": "XMLHttpRequest" },
                cache: "no-store"
            });

            const data = await response.json();
            const count = Number(data.count) || 0;

            if (count > 0) {
                badge.textContent = count;
                badge.style.display = "inline-block";
            } else {
                badge.textContent = "";
                badge.style.display = "none";
            }
        } catch (error) {
            console.error("Error actualizando badge de anuncios:", error);
            badge.style.display = "none";
        }
    }

    /* AL CARGAR */
    actualizarBadge();

    /* AL VOLVER A LA PESTAÑA (FIX CLAVE DEL BUG) */
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
            actualizarBadge();
        }
    });

});
</script>

</body>
</html>
