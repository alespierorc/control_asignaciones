{% extends "base.html" %}
{% block content %}

<style>
.auth-box {
    max-width: 420px;
    margin: 70px auto;
    background: var(--bg-panel);
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

.auth-box h2 {
    margin-bottom: 20px;
}

.auth-box input {
    width: 100%;
    padding: 10px;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 8px;
    color: var(--text);
    margin-bottom: 12px;
}

.auth-box button {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    background: var(--success);
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: 600;
    cursor: pointer;
}
</style>

<div class="auth-box">
    <h2>🔑 Nueva contraseña</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.new_password1 }}
        {{ form.new_password2 }}
        <button type="submit">Guardar contraseña</button>
    </form>
</div>

{% endblock %}
