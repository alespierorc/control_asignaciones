{% extends "base.html" %}
{% block content %}

<style>
.auth-box {
    max-width: 420px;
    margin: 70px auto;
    background: var(--bg-panel);
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

.auth-box h2 {
    margin-bottom: 10px;
}

.auth-box p {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 20px;
}

.auth-box input {
    width: 100%;
    padding: 10px;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 8px;
    color: var(--text);
}

.auth-box button {
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.auth-box button:hover {
    background: var(--accent-hover);
}
</style>

<div class="auth-box">
    <h2>🔐 Recuperar contraseña</h2>
    <p>
        Ingresa tu correo registrado en <strong>SIGMA – Control de Asignaciones</strong>.
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.email }}
        <button type="submit">Enviar enlace</button>
    </form>
</div>

{% endblock %}
