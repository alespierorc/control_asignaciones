{% extends "base.html" %}
{% block content %}

<style>
.info-box {
    max-width: 420px;
    margin: 70px auto;
    background: var(--bg-panel);
    padding: 35px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
.info-box p {
    color: var(--text-muted);
    margin-top: 15px;
}
.info-box a {
    display: inline-block;
    margin-top: 20px;
    color: var(--accent);
    font-weight: 600;
}
</style>

<div class="info-box">
    <h2>✅ Contraseña actualizada</h2>
    <p>Tu contraseña fue cambiada correctamente.</p>

    <a href="{% url 'asignaciones:login' %}">
        Iniciar sesión
    </a>
</div>

{% endblock %}
