{% extends "base.html" %}
{% block title %}Reportes - SERMINCO{% endblock %}

{% block content %}
<style>
  .panel-container {
    max-width: 1100px;
    margin: 40px auto;
    background: #0f172a;
    border-radius: 12px;
    padding: 30px 40px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
  }
  h1 {
    text-align: center;
    color: #38bdf8;
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 20px;
  }
  form {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
  }
  input[type="date"], button {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #374151;
    background: #1e293b;
    color: #f1f5f9;
  }
  button {
    background: #2563eb;
    border: none;
    cursor: pointer;
  }
  button:hover {
    background: #1d4ed8;
  }
  .chart-container {
    margin-bottom: 40px;
  }
</style>

<div class="panel-container">
  <h1><i class="bi bi-bar-chart-line"></i> Reportes de Expedientes</h1>

  <!-- Filtro de fechas -->
  <form method="get">
    <label>Desde:</label>
    <input type="date" name="fecha_inicio" value="{{ fecha_inicio }}">
    <label>Hasta:</label>
    <input type="date" name="fecha_fin" value="{{ fecha_fin }}">
    <button type="submit"><i class="bi bi-filter"></i> Filtrar</button>
    <a href="{% url 'asignaciones:exportar_excel' %}?fecha_inicio={{ fecha_inicio }}&fecha_fin={{ fecha_fin }}" class="chip" style="background:#1e3a8a; color:white;">
      <i class="bi bi-file-earmark-excel"></i> Exportar Excel
    </a>
  </form>

  <div class="chart-container">{{ chart_bar|safe }}</div>
  <div class="chart-container">{{ chart_pie|safe }}</div>
  <div class="chart-container">{{ chart_line|safe }}</div>
</div>
{% endblock %}
