{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SIGMA – Control de Asignaciones</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-dark: #0e1117;
            --bg-panel: #161b22;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
            --border-soft: #374151;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #111827, #020617);
            font-family: "Inter", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-panel);
            padding: 42px 40px;
            border-radius: 14px;
            border: 1px solid #1f2937;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65);
        }

        /* LOGO */
        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo i {
            font-size: 3.4rem;
            color: var(--accent);
        }

        .logo h1 {
            margin: 12px 0 4px;
            font-size: 1.9rem;
            letter-spacing: 2px;
        }

        .logo span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* FORM */
        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .field input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-soft);
            background: #020617;
            color: var(--text);
            font-size: 0.95rem;
        }

        .field input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-login {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-login:hover {
            background: var(--accent-hover);
        }

        .links {
            margin-top: 18px;
            text-align: center;
        }

        .links a {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
        }

        .links a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <!-- ICONO HIDROCARBUROS -->
        <i class="bi bi-fuel-pump"></i>
        <h1>SIGMA</h1>
        <span>Control de Asignaciones</span>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="field">
            <label>Usuario</label>
            <input type="text" name="username" required>
        </div>

        <div class="field">
            <label>Contraseña</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit" class="btn-login">
            Ingresar al sistema
        </button>

        <!-- 🔗 CONEXIÓN AL FLUJO DE RECUPERACIÓN -->
        <div class="links">
            <a href="{% url 'password_reset' %}">
                ¿Olvidaste tu contraseña?
            </a>
        </div>
    </form>

    <div class="footer">
        © 2025 SIGMA — Control de Asignaciones
    </div>

</div>

</body>
</html>
