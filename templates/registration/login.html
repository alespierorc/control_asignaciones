{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión | SERMINCO</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="login-bg">
    <div class="login-container">
        <div class="login-box">
            <h2 class="login-title">Acceso al Sistema SERMINCO</h2>

            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                        <li class="{{ message.tags }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Usuario" class="i-input" required>
                <input type="password" name="password" placeholder="Contraseña" class="i-input" required>
                <button type="submit" class="btn-login">Iniciar sesión</button>
            </form>

            <p class="footer-text">© SERMINCO 2025 - Acceso restringido</p>
        </div>
    </div>
</body>
</html>
