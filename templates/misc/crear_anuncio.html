{% extends "base.html" %}
{% load static %}

{% block title %}Crear anuncio{% endblock %}

{% block content %}
<style>
/* =========================
   CONTENEDOR
========================= */
.crear-wrap {
  margin: 50px auto;
  background: linear-gradient(180deg, #020617, #020617);
  border-radius: 26px;
  padding: 40px;
  max-width: 920px;
  box-shadow: 0 40px 80px rgba(0,0,0,.65);
  animation: fadeUp .6s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(35px); }
  to   { opacity: 1; transform: translateY(0); }
}

.crear-wrap h2 {
  font-size: 23px;
  font-weight: 800;
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 25px;
}

/* =========================
   SECCIONES
========================= */
.section {
  margin-bottom: 26px;
  padding-bottom: 26px;
  border-bottom: 1px solid #1f2937;
}

/* =========================
   CAMPOS
========================= */
.form-field { margin-bottom: 18px; }

label {
  font-size: 13px;
  font-weight: 700;
  color: #c7d2fe;
  margin-bottom: 6px;
  display: block;
}

input, textarea, select {
  width: 100%;
  background: #020617;
  border: 1px solid #1f2937;
  border-radius: 14px;
  padding: 13px 15px;
  color: #f9fafb;
  transition: .25s;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 4px rgba(59,130,246,.25);
}

textarea { min-height: 160px; }

.counter {
  font-size: 12px;
  text-align: right;
  color: #9ca3af;
  margin-top: 4px;
}

/* =========================
   EDITOR
========================= */
.editor-toolbar {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.editor-toolbar button {
  background: #020617;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 7px 11px;
  color: #e5e7eb;
  cursor: pointer;
  transition: .2s;
}

.editor-toolbar button:hover {
  background: #3b82f6;
  transform: translateY(-1px);
}

/* =========================
   PROGRAMACIÓN
========================= */
.programacion {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* =========================
   BOTONES
========================= */
.actions {
  display: flex;
  justify-content: flex-end;
  gap: 14px;
  margin-top: 30px;
}

.btn {
  border-radius: 999px;
  padding: 12px 30px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  gap: 8px;
  align-items: center;
  transition: .25s;
}

.btn-primary {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  border: none;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 20px 45px rgba(59,130,246,.6);
}

.btn-secondary {
  background: transparent;
  border: 1px solid #374151;
  color: #9ca3af;
}

.btn-secondary:hover {
  background: #1f2937;
  color: #fff;
}

/* =========================
   MODAL
========================= */
.modal-preview {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal-box {
  background: #020617;
  padding: 32px;
  border-radius: 24px;
  max-width: 650px;
  width: 92%;
  animation: zoom .35s ease;
}

@keyframes zoom {
  from { transform: scale(.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.close-modal {
  float: right;
  background: none;
  border: none;
  color: #ef4444;
  font-size: 18px;
  cursor: pointer;
}

.hidden { display: none; }

@media(max-width:768px){
  .programacion { grid-template-columns: 1fr; }
}
</style>

<div class="crear-wrap">
  <h2><i class="bi bi-megaphone-fill"></i> Crear anuncio corporativo</h2>

  <form method="POST" id="formAnuncio">
    {% csrf_token %}

    <!-- CONTENIDO -->
    <div class="section">
      <div class="form-field">
        <label>Título</label>
        <input type="text" name="titulo" id="titulo" required>
      </div>

      <div class="form-field">
        <label>Contenido</label>

        <div class="editor-toolbar">
          <button type="button" onclick="format('bold')"><b>B</b></button>
          <button type="button" onclick="format('italic')"><i>I</i></button>
          <button type="button" onclick="addLink()">🔗</button>
        </div>

        <textarea name="contenido" id="contenido" required></textarea>
        <div class="counter" id="counter">0 caracteres</div>
      </div>
    </div>

    <!-- DESTINO -->
    <div class="section">
      <div class="form-field">
        <label>Tipo de anuncio</label>
        <select name="tipo" id="tipo">
          <option value="general">General</option>
          <option value="grupo">Por grupo</option>
          <option value="individual">Individual</option>
        </select>
      </div>

      <div class="form-field hidden" id="grupoField">
        <label>Grupo destino</label>
        <select name="grupo_destino">
          <option value="">Seleccione</option>
          {% for g in grupos %}
          <option value="{{ g.id }}">{{ g.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-field hidden" id="usuarioField">
        <label>Usuario destinatario</label>
        <select name="destinatario">
          <option value="">Seleccione</option>
          {% for u in usuarios %}
          <option value="{{ u.id }}">{{ u.get_full_name|default:u.username }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- PROGRAMACIÓN -->
    <div class="section">
      <label>Programación (opcional)</label>
      <div class="programacion">
        <input type="datetime-local" name="fecha_inicio">
        <input type="datetime-local" name="fecha_fin">
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-secondary" onclick="previewAnuncio()">
        <i class="bi bi-eye-fill"></i> Vista previa
      </button>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-send-fill"></i> Publicar
      </button>
    </div>
  </form>
</div>

<!-- MODAL -->
<div class="modal-preview" id="modal">
  <div class="modal-box">
    <button class="close-modal" onclick="closeModal()">✖</button>
    <h3 id="previewTitulo"></h3>
    <p id="previewContenido"></p>
  </div>
</div>

<script>
const tipo = document.getElementById("tipo");
const grupoField = document.getElementById("grupoField");
const usuarioField = document.getElementById("usuarioField");
const contenido = document.getElementById("contenido");
const counter = document.getElementById("counter");

tipo.addEventListener("change", () => {
  grupoField.classList.add("hidden");
  usuarioField.classList.add("hidden");
  if (tipo.value === "grupo") grupoField.classList.remove("hidden");
  if (tipo.value === "individual") usuarioField.classList.remove("hidden");
});

contenido.addEventListener("input", () => {
  counter.textContent = contenido.value.length + " caracteres";
});

function format(type) {
  const s = contenido.selectionStart;
  const e = contenido.selectionEnd;
  if (s === e) return;

  const text = contenido.value;
  const sel = text.substring(s, e);
  const f = type === "bold" ? `**${sel}**` : `_${sel}_`;
  contenido.value = text.slice(0, s) + f + text.slice(e);
}

function addLink() {
  const url = prompt("URL:");
  if (url) contenido.value += ` [Texto](${url}) `;
}

function previewAnuncio() {
  previewTitulo.textContent = titulo.value;
  previewContenido.textContent = contenido.value;
  modal.style.display = "flex";
}

function closeModal() {
  modal.style.display = "none";
}

document.getElementById("formAnuncio").addEventListener("submit", e => {
  e.preventDefault();
  Swal.fire({
    title: "¿Publicar anuncio?",
    icon: "question",
    showCancelButton: true,
    confirmButtonText: "Publicar",
    background: "#020617",
    color: "#e5e7eb"
  }).then(r => r.isConfirmed && e.target.submit());
});
</script>
{% endblock %}
