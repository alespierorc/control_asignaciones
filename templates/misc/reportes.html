{% extends "base.html" %}
{% block content %}

<div class="container">
  <h1 class="titulo">📑 Panel de Reportes</h1>
  <p class="descripcion">
    Aquí puedes acceder a los distintos reportes generados automáticamente por el sistema.
  </p>

  <div class="opciones">
    <a href="{% url 'reportes_dashboard' %}" class="btn">📊 Ver Panel de Gráficos</a>
  </div>
</div>

<style>
body {
  background: linear-gradient(to bottom right, #0f172a, #1e293b);
  color: #e2e8f0;
  font-family: 'Segoe UI', sans-serif;
}
.container {
  max-width: 800px;
  margin: 100px auto;
  text-align: center;
  padding: 30px;
  background: rgba(15, 23, 42, 0.8);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}
.titulo {
  font-size: 2.2rem;
  color: #60a5fa;
  margin-bottom: 10px;
}
.descripcion {
  font-size: 0.95rem;
  color: #9ca3af;
  margin-bottom: 30px;
}
.opciones {
  display: flex;
  justify-content: center;
}
.btn {
  background-color: #2563eb;
  color: white;
  padding: 12px 28px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s ease;
}
.btn:hover {
  background-color: #1e40af;
  transform: scale(1.05);
}
</style>
{% endblock %}
